AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: FastAPI based email campaign Lambda

Resources:
  EmailCampaignFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: email-campaign-function
      Runtime: python3.11
      Handler: main.handler
      CodeUri: .
      Timeout: 30
      MemorySize: 256
      Policies:
        - AWSLambdaBasicExecutionRole
        - Statement:
            Effect: Allow
            Action:
              - secretsmanager:GetSecretValue
            Resource: "*"
      Environment:
        Variables:
          SENDGRID_API_KEY: !Ref SendGridApiKey
      Events:
        Api:
          Type: Api
          Properties:
            Path: /send_campaign
            Method: post

Parameters:
  SendGridApiKey:
    Type: String
    Description: SendGrid API key stored as a parameter